name: validate

# Windows CI: the release gate + the whole test suite.
#
# WHY THIS EXISTS
# The documented test workflow was a `Get-ChildItem | ForEach-Object { powershell.exe -File ... }`
# loop that DISCARDED every exit code, so a run reported success regardless of failures. It also
# conflated SKIP with PASS, and had no timeout - one hung suite (Test-DragResize hangs by design)
# would stall the job until GitHub's own limit killed it.
#
# This workflow runs the aggregate runner, which captures each suite's exit code, classifies skips
# separately, imposes a per-suite timeout, and returns nonzero if anything failed. The release
# validator runs too: the suites prove BEHAVIOUR, the validator proves STRUCTURE, and the two are
# meant to be read together (a gate catches a structural regression, a suite catches a behavioural
# one).
#
# Everything here is headless and needs no admin. Test-RemoteTask registers a SYSTEM scheduled task,
# so it SKIPS in CI by design - that skip is reported, not hidden.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    name: Release gate + test suite (Windows PowerShell 5.1)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Report the PowerShell version under test
        shell: powershell
        run: |
          # The project targets Windows PowerShell 5.1. windows-latest ships it as `powershell`.
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "Expected Windows PowerShell 5.1; got $($PSVersionTable.PSVersion). The suites are not PS7-certified."
            exit 1
          }

      - name: Release validation (structural gates)
        shell: powershell
        run: |
          # -STA is required. The validator asserts STA-sensitive wiring and the relaunch paths.
          # -Json writes the full verdict list (PASS/FAIL/WARN/SKIP/NOT_IMPLEMENTED) to a file so a
          # consumer gates on a FIELD rather than scraping text, and so a check that did NOT run is
          # distinguishable from one that passed.
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Scripts\Validate-Release.ps1 -Json gate-report.json
          $code = $LASTEXITCODE
          if (Test-Path gate-report.json) {
            $r = Get-Content gate-report.json -Raw | ConvertFrom-Json
            Write-Host ("gate: passed={0} PASS={1} FAIL={2} WARN={3} SKIP={4} NOT_IMPLEMENTED={5}" -f `
              $r.Passed, $r.Totals.PASS, $r.Totals.FAIL, $r.Totals.WARN, $r.Totals.SKIP, $r.Totals.NOT_IMPLEMENTED)
          }
          if ($code -ne 0) {
            Write-Error "Release validation failed with exit code $code"
            exit $code
          }

      - name: Test suites (behavioural)
        shell: powershell
        run: |
          # The aggregate runner returns nonzero if any suite fails, counts assertions, and imposes a
          # per-suite timeout. Do NOT replace this with a bare ForEach-Object loop - that is precisely
          # the pattern that discarded exit codes and reported green on a failing tree.
          #
          # -Json is captured here rather than in a separate step: the previous workflow re-RAN the whole
          # suite just to obtain the summary, which doubled CI time and made the summary describe a
          # second, different execution than the one that produced the verdict.
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Scripts\Invoke-TestSuites.ps1 -TimeoutSeconds 600 -Json |
            Tee-Object -FilePath suite-output.txt
          $code = $LASTEXITCODE
          Select-String -Path suite-output.txt -Pattern '^SUMMARY_JSON ' | ForEach-Object {
            $_.Line -replace '^SUMMARY_JSON ', '' | Set-Content suite-summary.json -Encoding utf8
          }
          if ($code -ne 0) {
            Write-Error "Test run failed with exit code $code"
            exit $code
          }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        # `if: always()` so the reports survive a failure - they are what makes a failure diagnosable
        # without opening the log, and a failing run is exactly when they are needed.
        with:
          name: validation-reports
          path: |
            gate-report.json
            suite-summary.json
          if-no-files-found: warn
