name: validate

# Windows CI: the release gate + the whole test suite.
#
# WHY THIS EXISTS
# The documented test workflow was a `Get-ChildItem | ForEach-Object { powershell.exe -File ... }`
# loop that DISCARDED every exit code, so a run reported success regardless of failures. It also
# conflated SKIP with PASS, and had no timeout - one hung suite (Test-DragResize hangs by design)
# would stall the job until GitHub's own limit killed it.
#
# This workflow runs the aggregate runner, which captures each suite's exit code, classifies skips
# separately, imposes a per-suite timeout, and returns nonzero if anything failed. The release
# validator runs too: the suites prove BEHAVIOUR, the validator proves STRUCTURE, and the two are
# meant to be read together (a gate catches a structural regression, a suite catches a behavioural
# one).
#
# Everything here is headless and needs no admin. Test-RemoteTask registers a SYSTEM scheduled task,
# so it SKIPS in CI by design - that skip is reported, not hidden.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    name: Release gate + test suite (Windows PowerShell 5.1)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Report the PowerShell version under test
        shell: powershell
        run: |
          # The project targets Windows PowerShell 5.1. windows-latest ships it as `powershell`.
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "Expected Windows PowerShell 5.1; got $($PSVersionTable.PSVersion). The suites are not PS7-certified."
            exit 1
          }

      - name: Release validation (structural gates)
        shell: powershell
        run: |
          # -STA is required. The validator asserts STA-sensitive wiring and the relaunch paths.
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Scripts\Validate-Release.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release validation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Test suites (behavioural)
        shell: powershell
        run: |
          # The aggregate runner returns nonzero if any suite fails, counts assertions, and imposes a
          # per-suite timeout. Do NOT replace this with a bare ForEach-Object loop - that is precisely
          # the pattern that discarded exit codes and reported green on a failing tree.
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Scripts\Invoke-TestSuites.ps1 -TimeoutSeconds 600
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Test run failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Machine-readable summary
        if: always()
        shell: powershell
        # `if: always()` so the summary is produced even when a previous step failed - the JSON is
        # what makes a failure diagnosable without opening the log.
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Scripts\Invoke-TestSuites.ps1 -TimeoutSeconds 600 -Json |
            Where-Object { $_ -like 'SUMMARY_JSON*' }
